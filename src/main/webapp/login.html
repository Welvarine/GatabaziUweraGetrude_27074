<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
    font-family: "Times New Roman", Times, serif;
    font-size: 20px;                   
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;

 
    background: linear-gradient(135deg, #f2e6ce 0%, #e8d8b5 100%);
}

.login-container {
    background: #fbf6ec;
    padding: 40px;
    border-radius: 5px;
    width: 360px;                        

    border: 1px solid #bfae8a;
    box-shadow:
        0 10px 25px rgba(0,0,0,0.15),
        inset 0 0 10px rgba(191,174,138,0.3);

    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    color: #5a4632;
    margin-bottom: 20px;
    letter-spacing: 1px;
    font-size: 30px;             
}


h2::after {
    content: "✦";
    display: block;
    margin-top: 6px;
    color: #8c6d3f;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #5a4632;
    font-weight: bold;
    font-size: 20px;                  
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #c2b08c;
    border-radius: 4px;
    box-sizing: border-box;

    font-size: 19px;                  
    background: #fffdfa;
    font-family: "Times New Roman", Times, serif;
}

input:focus {
    outline: none;
    border-color: #8c6d3f;
    box-shadow: 0 0 6px rgba(140,109,63,0.4);
}


button {
    width: 100%;
    padding: 13px;

    background: linear-gradient(135deg, #8c6d3f 0%, #6e552e 100%);
    color: white;

    border: 1px solid #5c4726;
    border-radius: 4px;

    font-size: 20px;                    
    cursor: pointer;
    font-family: "Times New Roman", Times, serif;

    transition: 0.3s;
}

button:hover {
    background: linear-gradient(135deg, #a07f4c 0%, #7d6235 100%);
}


.back-link {
    text-align: center;
    margin-top: 14px;
}

.back-link a {
    color: #6e552e;
    text-decoration: none;
    font-size: 18px;                 
}

.back-link a:hover {
    text-decoration: underline;
}


.login-container::before {
    content: "WELCOME";
    display: block;
    text-align: center;
    color: #8c6d3f;
    margin-bottom: 10px;
    letter-spacing: 2px;
    font-size: 18px;                   
}
</style>
</head>

<body>
<div class="login-container">
    <h2>Login</h2>

    <form action="LoginServlet" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="enter username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••">
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="back-link">
        <a href="index.jsp">← Back to Home</a>
    </div>
</div>
</body>
</html>
